region: us-east4

server:
  bind: "127.0.0.1:9464"

reference_slot:
  source: max_observed

providers:
  - name: helius
    url: "https://beta.helius-rpc.com/?api-key=${HELIUS_API_KEY}"
  - name: triton
    url: "https://${TRITON_HOST}/${TRITON_TOKEN}"
  - name: quicknode
    url: "${QUICKNODE_URL}"

checks:
  - method: get_health
    interval: "60s"
    jitter: "5s"
  - method: get_slot
    interval: "60s"
    jitter: "5s"
  - method: get_latest_blockhash
    interval: "60s"
    jitter: "5s"
  - method: get_account_info
    interval: "60s"
    jitter: "5s"
  - method: get_program_accounts
    interval: "60s"
    jitter: "5s"
  - method: get_block_recent
    interval: "60s"
    jitter: "5s"

request_timeout: "10s"
