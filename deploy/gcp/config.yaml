# Fleet configuration shipped to every monitor VM (via Terraform instance
# metadata). This is the deployed source of truth — review changes here.
#
# No secrets live in this file: api-keys/hosts are ${ENV} placeholders resolved
# on the VM at boot from Doppler. `region` is a fallback only; each VM overrides
# it with MONITOR_REGION, derived from its zone by the startup script.

region: us-east4

server:
  # Localhost-only: metrics are scraped by the co-located Alloy agent, never
  # exposed publicly.
  bind: "127.0.0.1:9464"

reference_slot:
  source: max_observed

providers:
  - name: helius
    url: "https://beta.helius-rpc.com/?api-key=${HELIUS_API_KEY}"
  - name: triton
    url: "https://${TRITON_HOST}/${TRITON_TOKEN}"

checks:
  - method: get_health
    interval: "60s"
    jitter: "5s"
  - method: get_slot
    interval: "60s"
    jitter: "5s"
  - method: get_latest_blockhash
    interval: "60s"
    jitter: "5s"
  - method: get_account_info
    interval: "60s"
    jitter: "5s"
  - method: get_program_accounts
    interval: "60s"
    jitter: "5s"
  - method: get_block_recent
    interval: "60s"
    jitter: "5s"

request_timeout: "10s"
