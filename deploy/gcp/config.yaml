region: us-east4

server:
  bind: "127.0.0.1:9464"

reference_slot:
  source: endpoint
  endpoint: "${REFERENCE_RPC_URL}"
  poll_interval: "1s"

reference_check:
  rpc_url: "${REFERENCE_RPC_URL}"
  interval: "5m"

gpa_derive:
  endpoint: "${REFERENCE_RPC_URL}"

providers:
  - name: chainstack
    url: "${CHAINSTACK_URL}"
  - name: fluxrpc
    url: "https://cdn.fluxrpc.com?key=${FLUXRPC_KEY}"
    geos: [us-east, us-west, eu-central, eu-west]
    region_urls:
      europe-west2: "https://eu.fluxrpc.com?key=${FLUXRPC_KEY}"
      europe-west3: "https://eu.fluxrpc.com?key=${FLUXRPC_KEY}"
      europe-west4: "https://eu.fluxrpc.com?key=${FLUXRPC_KEY}"
      eu-west-2: "https://eu.fluxrpc.com?key=${FLUXRPC_KEY}"
      eu-central-1: "https://eu.fluxrpc.com?key=${FLUXRPC_KEY}"
      eu-west-1: "https://eu.fluxrpc.com?key=${FLUXRPC_KEY}"
      fra: "https://eu.fluxrpc.com?key=${FLUXRPC_KEY}"
      ams: "https://eu.fluxrpc.com?key=${FLUXRPC_KEY}"
      lon: "https://eu.fluxrpc.com?key=${FLUXRPC_KEY}"
      fra2: "https://eu.fluxrpc.com?key=${FLUXRPC_KEY}"
      lon1: "https://eu.fluxrpc.com?key=${FLUXRPC_KEY}"
      ams3: "https://eu.fluxrpc.com?key=${FLUXRPC_KEY}"
      us-east4: "https://us.fluxrpc.com?key=${FLUXRPC_KEY}"
      us-west2: "https://us.fluxrpc.com?key=${FLUXRPC_KEY}"
      us-east-1: "https://us.fluxrpc.com?key=${FLUXRPC_KEY}"
      us-west-1: "https://us.fluxrpc.com?key=${FLUXRPC_KEY}"
      nyc: "https://us.fluxrpc.com?key=${FLUXRPC_KEY}"
      lax: "https://us.fluxrpc.com?key=${FLUXRPC_KEY}"
      ewr2: "https://us.fluxrpc.com?key=${FLUXRPC_KEY}"
      pit1: "https://us.fluxrpc.com?key=${FLUXRPC_KEY}"
      lax1: "https://us.fluxrpc.com?key=${FLUXRPC_KEY}"
  - name: helius
    url: "https://beta.helius-rpc.com/?api-key=${HELIUS_API_KEY}"
  - name: triton
    url: "https://${TRITON_HOST}/${TRITON_TOKEN}"
  - name: quicknode
    url: "${QUICKNODE_URL}"
  - name: alchemy
    url: "${ALCHEMY_URL}"
  - name: solanavibestation
    url: "https://elite.rpc.solanavibestation.com/?api_key=${SOLANAVIBESTATION_API_KEY}"
    geos: [us-east, us-west, eu-central, eu-west]
  - name: erpc
    url: "https://edge.erpc.global/?api-key=${ERPC_API_KEY}"
  - name: erpc-unlimited
    url: "${ERPC_UNLIMITED_FRA_URL}"
    # Region-fixed Unlimited endpoints: one per city we run nodes in
    # (Tokyo, New York, London, Amsterdam, Frankfurt, Singapore). No node in
    # US West, so that geo is left out rather than measured through anycast.
    geos: [us-east, eu-central, eu-west, ap-northeast, ap-southeast]
    region_urls:
      us-east4: "${ERPC_UNLIMITED_NYC_URL}"
      us-east-1: "${ERPC_UNLIMITED_NYC_URL}"
      nyc: "${ERPC_UNLIMITED_NYC_URL}"
      ewr: "${ERPC_UNLIMITED_NYC_URL}"
      ewr2: "${ERPC_UNLIMITED_NYC_URL}"
      pit: "${ERPC_UNLIMITED_NYC_URL}"
      pit1: "${ERPC_UNLIMITED_NYC_URL}"
      europe-west3: "${ERPC_UNLIMITED_FRA_URL}"
      eu-central-1: "${ERPC_UNLIMITED_FRA_URL}"
      fra: "${ERPC_UNLIMITED_FRA_URL}"
      fra2: "${ERPC_UNLIMITED_FRA_URL}"
      europe-west4: "${ERPC_UNLIMITED_AMS_URL}"
      ams: "${ERPC_UNLIMITED_AMS_URL}"
      ams3: "${ERPC_UNLIMITED_AMS_URL}"
      europe-west2: "${ERPC_UNLIMITED_LON_URL}"
      eu-west-2: "${ERPC_UNLIMITED_LON_URL}"
      eu-west-1: "${ERPC_UNLIMITED_LON_URL}"
      lon: "${ERPC_UNLIMITED_LON_URL}"
      lon1: "${ERPC_UNLIMITED_LON_URL}"
      asia-northeast1: "${ERPC_UNLIMITED_TYO_URL}"
      ap-northeast-1: "${ERPC_UNLIMITED_TYO_URL}"
      tyo: "${ERPC_UNLIMITED_TYO_URL}"
      tyo2: "${ERPC_UNLIMITED_TYO_URL}"
      asia-southeast1: "${ERPC_UNLIMITED_SGP_URL}"
      ap-southeast-1: "${ERPC_UNLIMITED_SGP_URL}"
      sgp: "${ERPC_UNLIMITED_SGP_URL}"
      sgp2: "${ERPC_UNLIMITED_SGP_URL}"

checks:
  - method: get_health
    interval: "60s"
    jitter: "5s"
  - method: get_slot
    interval: "60s"
    jitter: "5s"
  - method: get_latest_blockhash
    interval: "60s"
    jitter: "5s"
  - method: get_account_info
    interval: "60s"
    jitter: "5s"
  - method: get_multiple_accounts
    interval: "60s"
    jitter: "5s"
  - method: get_program_accounts
    interval: "60s"
    jitter: "5s"
    timeout: "30s"
  - method: get_token_accounts_by_owner
    interval: "60s"
    jitter: "5s"
  - method: get_block_recent
    interval: "60s"
    jitter: "5s"
  - method: get_transaction_recent
    interval: "60s"
    jitter: "5s"
  - method: get_signatures_for_address
    interval: "60s"
    jitter: "5s"

request_timeout: "10s"
archival_interval: "120s"
archival_timeout: "30s"

gpa_targets:
  - name: token_owner
    program: TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA
    data_size: 165
    memcmp: [{ offset: 32, bytes: "9WzDXwBbmkg8ZTbNMqUxvQRAyrZzDsGYdLVL9zYtAWWM" }]
  - name: vote_accounts
    program: Vote111111111111111111111111111111111111111
    data_size: 3762
