[defaults]
inventory = inventory
roles_path = roles
retry_files_enabled = False
stdout_callback = default

[callback_default]
result_format = yaml

[ssh_connection]
pipelining = True
# Strict host-key verification against a pre-provisioned known_hosts,
# materialized from Doppler (KNOWN_HOSTS_B64) by deploy.sh alongside the
# inventories. No trust-on-first-use: an unknown or changed host key fails the
# connection before any play (or the Doppler token) reaches the box.
ssh_args = -o UserKnownHostsFile=known_hosts -o StrictHostKeyChecking=yes
