[defaults]
inventory = inventory
roles_path = roles
retry_files_enabled = False
stdout_callback = default

[callback_default]
result_format = yaml

[ssh_connection]
pipelining = True
# Trust-on-first-use: record a host key on first contact, hard-fail if a known
# host's key ever changes (an impersonated/redirected box can't receive the
# Doppler token). The runner's known_hosts persists across deploys.
ssh_args = -o StrictHostKeyChecking=accept-new
