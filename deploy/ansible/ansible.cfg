[defaults]
inventory = inventory
roles_path = roles
retry_files_enabled = False
stdout_callback = default

[callback_default]
result_format = yaml

[ssh_connection]
pipelining = True
# Setting ssh_args drops Ansible's default multiplexing, so restore it: one
# connection per host instead of one per task. Public sshd on the metal hosts
# is under constant scanning and drops new connections past MaxStartups;
# retries (with backoff) ride that out instead of failing the deploy.
ssh_args = -o UserKnownHostsFile=known_hosts -o StrictHostKeyChecking=yes -o ControlMaster=auto -o ControlPersist=60s
retries = 5
