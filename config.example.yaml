# rpc-latency-monitor — example configuration.
#
# Copy to config.yaml and edit. Secrets must NOT be inlined here: use ${ENV_VAR}
# placeholders for api-keys (resolved at startup from the environment / .env).
#
# Durations accept humantime strings: "500ms", "2s", "1m".

# This instance's region tag. On GCP it is overridden by the MONITOR_REGION env
# var, which the startup script derives from the VM's zone metadata.
region: local

server:
  # Address for the Prometheus /metrics and /health endpoints.
  bind: "0.0.0.0:9464"

reference_slot:
  # How the chain "tip" slot is tracked to compute per-response slot lag.
  #   max_observed: take the highest `processed` slot seen across all providers
  #                 (neutral — depends on no single provider).
  source: max_observed
  # Optional: a dedicated endpoint polled for the reference slot. Leave unset to
  # rely purely on max_observed.
  # endpoint: "https://api.mainnet-beta.solana.com"
  # poll_interval: "1s"

# Verify provider responses against a trusted reference RPC (ground truth):
# a blockhash is unforgeable, so a mismatch means wrong/fabricated data. Two
# mechanisms, both requiring `claim_checks: true` (or MONITOR_CLAIM_CHECKS=true)
# AND a reference_check.rpc_url — with claim_checks false (the default) neither
# runs, regardless of rpc_url. Both are fail-open (a slow or unreachable
# reference records `skipped`, never penalizes a provider):
#   1. Periodic cross-check: each provider's finalized getBlock blockhash at
#      tip-depth vs the reference (rpc_reference_check_total).
#   2. Claim verification:
#      successful probe responses yield claims verified against the reference
#      node >= claim_delay_slots later, emitted as
#      rpc_claim_check_total{provider, method, result} with result one of
#      match | drift | mismatch | missing | skipped | implausible.
#        - getLatestBlockhash / getBlock_recent: (slot, blockhash) vs the
#          node's getBlock (blockhashes are unforgeable)
#        - getProgramAccounts / getTokenAccountsByOwner: account count vs the
#          node's own count (claim_count_tolerance), plus sampled pubkeys that
#          must exist on the node with the probe's owner/size; byte-identical
#          data = match, legitimate balance movement = drift
#        - getTransaction_recent / getSignaturesForAddress: the claimed
#          (signature, slot) must be known to the node at the same slot
#        - getBlock_archival / getTransaction_archival: verified the same way
#          but against `archival_rpc_url` (a trusted archival endpoint) — our
#          reference node runs a limited ledger and has purged ~40M-slots-ago
#          history. Left unset (the default) these two verdicts are `skipped`.
#        - getAccountInfo (clock sysvar): unix_timestamp within 2 minutes of
#          wall time, else implausible
#        - any slot-bearing response claiming more than claim_margin slots
#          ahead of the node tip is implausible (a claim about the future)
#      If the node itself trails the fleet-observed tip by more than
#      node_stale_slots, verdicts become `skipped` and implausibility is not
#      flagged (provider values are trusted while our node lags); the lag is
#      exported as rpc_reference_node_lag.
# The reference is used only for correctness, never for latency.
# claim_checks: false
# reference_check:
#   rpc_url: "http://<reference-node>:8899"
#   archival_rpc_url: ""       # trusted archival RPC for the two archival
#                              # methods; ideally NOT one of the measured
#                              # providers (a provider shouldn't be graded by
#                              # its own archival tier). Empty = archival
#                              # verdicts are skipped.
#   exclude_provider: helius   # don't judge the reference against itself
#   interval: "5m"
#   depth: 64                  # checked slot = reference finalized tip - depth
#   claim_delay_slots: 32      # settle time before verifying a claim
#   claim_margin: 16           # slots a claim may lead the reference tip
#   claim_count_tolerance: 8   # allowed drift vs the node's own gPA count
#   node_stale_slots: 64       # node lag beyond which verdicts are skipped

# getProgramAccounts probe targets. The gPA check rotates through this list
# round-robin (one target per probe) and labels its metrics with
# target=<name>; non-gPA metrics carry target="". Each entry should be a real
# heavy query shape seen in production traffic. The list is config-driven and
# static on purpose: cross-provider comparability and claim verification both
# need known filters. Filters mirror the RPC's dataSize / memcmp (offset +
# base58 bytes); every returned account is validated against them, and claim
# verification re-runs the same filters against the reference node.
# Omit this key to use the built-in token_owner target only.
gpa_targets:
  # Token accounts of one owner (the long-standing default probe).
  - name: token_owner
    program: TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA
    data_size: 165
    memcmp: [{ offset: 32, bytes: 9WzDXwBbmkg8ZTbNMqUxvQRAyrZzDsGYdLVL9zYtAWWM }]
  # Stake accounts by withdraw authority (StakeStateV2: staker at offset 12,
  # withdrawer at offset 44).
  # - name: stake_withdraw
  #   program: Stake11111111111111111111111111111111111111
  #   data_size: 200
  #   memcmp: [{ offset: 44, bytes: <withdraw-authority> }]
  # DEX pool enumeration by dataSize (Raydium-style pool discovery).
  # - name: dex_pools
  #   program: 675kPX9MHTjS2zt1qfr1NYHuzeLXfQM9H24wFSUt1Mp8
  #   data_size: 752
  # Holders of a mid-cap mint. Keep the result set in the low thousands —
  # response size is ~220 bytes per account.
  # - name: mint_holders
  #   program: TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA
  #   data_size: 165
  #   memcmp: [{ offset: 0, bytes: <mint> }]

# RPC providers to benchmark. `url` may contain a ${ENV_VAR} placeholder; the
# whole api-key/url secret is supplied via the environment.
providers:
  - name: alchemy
    url: "${ALCHEMY_URL}"
  - name: helius
    url: "https://mainnet.helius-rpc.com/?api-key=${HELIUS_API_KEY}"
  - name: quicknode
    url: "${QUICKNODE_URL}"
  - name: triton
    url: "https://${TRITON_HOST}/${TRITON_TOKEN}"

# Read checks to run against every provider. Each runs on its own loop.
# `interval` is the base period; `jitter` randomizes it to avoid thundering herd.
checks:
  - method: get_health
    interval: "5s"
    jitter: "1s"
  - method: get_slot
    interval: "2s"
    jitter: "500ms"
  - method: get_latest_blockhash
    interval: "5s"
    jitter: "1s"
  - method: get_account_info
    interval: "10s"
    jitter: "2s"
  - method: get_multiple_accounts
    interval: "10s"
    jitter: "2s"
  - method: get_program_accounts
    interval: "30s"
    jitter: "5s"
  - method: get_token_accounts_by_owner
    interval: "30s"
    jitter: "5s"
  - method: get_block_recent
    interval: "10s"
    jitter: "2s"
  - method: get_transaction_recent
    interval: "10s"
    jitter: "2s"
  - method: get_signatures_for_address
    interval: "10s"
    jitter: "2s"
  - method: get_block_archival
    interval: "30s"
    jitter: "5s"
    timeout: "30s"
  - method: get_transaction_archival
    interval: "30s"
    jitter: "5s"
    timeout: "30s"

# Per-request timeout for outbound RPC calls.
request_timeout: "10s"
