name: deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "What to deploy (auto = detect from changed files)"
        required: true
        type: choice
        default: auto
        options: [auto, all, grafana, gcp]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  detect:
    name: detect changed targets
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    outputs:
      grafana: ${{ steps.tiers.outputs.grafana }}
      gcp: ${{ steps.tiers.outputs.gcp }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        run: |
          set -e
          BASE=$(git rev-parse HEAD~1)
          REF=${{ github.event.workflow_run.head_sha || github.sha }}
          CHANGED=$(git diff --name-only "$BASE" "$REF")
          echo "Changed files:"; echo "$CHANGED" | sed 's/^/  /'
          match() { echo "$CHANGED" | grep -qE "$1"; }

          GRAF=false
          GCP=false
          match '^grafana/' && GRAF=true
          match '^src/|^Cargo\.(toml|lock)$|^deploy/|^config\.example\.yaml$' && GCP=true
          echo "grafana=$GRAF" >> "$GITHUB_OUTPUT"
          echo "gcp=$GCP" >> "$GITHUB_OUTPUT"

      - name: Resolve target override
        id: tiers
        run: |
          mode="${{ inputs.target || 'auto' }}"
          case "$mode" in
            grafana) gr=true;  gcp=false ;;
            gcp)     gr=false; gcp=true  ;;
            all)     gr=true;  gcp=true  ;;
            auto|*)
              gr="${{ steps.filter.outputs.grafana }}"
              gcp="${{ steps.filter.outputs.gcp }}"
              ;;
          esac
          echo "grafana=$gr" >> "$GITHUB_OUTPUT"
          echo "gcp=$gcp" >> "$GITHUB_OUTPUT"
          echo "Resolved (mode=$mode): grafana=$gr gcp=$gcp"

  deploy-grafana:
    name: push dashboard to Grafana Cloud
    needs: detect
    if: needs.detect.outputs.grafana == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dopplerhq/cli-action@v3
      - name: Push dashboard
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set -euo pipefail
          export $(doppler secrets download --no-file --format env \
            --project rpc-latency-monitor --config prd | xargs)
          echo "::add-mask::$GRAFANA_API_TOKEN"
          payload=$(jq -n --slurpfile d grafana/dashboard.json --arg folder "$GRAFANA_FOLDER_UID" \
            '{dashboard: ($d[0] + {id: null}), folderUid: $folder, overwrite: true}')
          curl -sS --fail-with-body -X POST "$GRAFANA_API_URL/api/dashboards/db" \
            -H "Authorization: Bearer $GRAFANA_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$payload"

  deploy-gcp:
    name: build image and apply terraform
    needs: detect
    if: needs.detect.outputs.gcp == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      MONITOR_IMAGE: ${{ vars.MONITOR_IMAGE }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push image
        run: |
          gcloud builds submit . --project "$PROJECT_ID" \
            --config deploy/cloudbuild.yaml \
            --substitutions=_IMAGE="$MONITOR_IMAGE"

      - uses: hashicorp/setup-terraform@v3
      - name: Terraform apply
        working-directory: deploy/gcp/terraform
        env:
          TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
          TF_VAR_monitor_image: ${{ vars.MONITOR_IMAGE }}
          TF_VAR_doppler_token: ${{ secrets.MONITOR_DOPPLER_TOKEN }}
        run: |
          terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=rpc-latency-monitor"
          terraform apply -auto-approve
