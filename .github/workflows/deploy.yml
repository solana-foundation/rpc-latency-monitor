name: deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "What to deploy"
        required: true
        type: choice
        default: all
        options: [all, grafana, gcp]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  detect:
    name: resolve targets
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    outputs:
      grafana: ${{ steps.t.outputs.grafana }}
      gcp: ${{ steps.t.outputs.gcp }}
    steps:
      - name: Resolve target
        id: t
        run: |
          # workflow_run has no input -> deploy everything. Both targets are
          # idempotent (dashboard upsert, terraform apply), so deploying both
          # on every main CI success is safe and avoids fragile path detection.
          mode="${{ inputs.target || 'all' }}"
          case "$mode" in
            grafana) gr=true;  gcp=false ;;
            gcp)     gr=false; gcp=true  ;;
            all|*)   gr=true;  gcp=true  ;;
          esac
          echo "grafana=$gr" >> "$GITHUB_OUTPUT"
          echo "gcp=$gcp" >> "$GITHUB_OUTPUT"
          echo "Resolved (mode=$mode): grafana=$gr gcp=$gcp"

  deploy-grafana:
    name: push dashboard to Grafana Cloud
    needs: detect
    if: needs.detect.outputs.grafana == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dopplerhq/cli-action@v3
      - name: Push dashboard
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set -euo pipefail
          get() { doppler secrets get "$1" --plain --project rpc-latency-monitor --config prd; }
          # Fetch only the dashboard-push creds, and mask the token before use.
          GRAFANA_API_TOKEN="$(get GRAFANA_API_TOKEN)"
          echo "::add-mask::$GRAFANA_API_TOKEN"
          GRAFANA_API_URL="$(get GRAFANA_API_URL)"
          GRAFANA_FOLDER_UID="$(get GRAFANA_FOLDER_UID)"
          payload=$(jq -n --slurpfile d grafana/dashboard.json --arg folder "$GRAFANA_FOLDER_UID" \
            '{dashboard: ($d[0] + {id: null}), folderUid: $folder, overwrite: true}')
          curl -sS --fail-with-body -X POST "$GRAFANA_API_URL/api/dashboards/db" \
            -H "Authorization: Bearer $GRAFANA_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$payload"

  deploy-gcp:
    name: build image and apply terraform
    needs: detect
    if: needs.detect.outputs.gcp == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      MONITOR_IMAGE: ${{ vars.MONITOR_IMAGE }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push image
        run: |
          gcloud builds submit . --project "$PROJECT_ID" \
            --config deploy/cloudbuild.yaml \
            --substitutions=_IMAGE="$MONITOR_IMAGE"

      - uses: hashicorp/setup-terraform@v3
      - name: Terraform plan & apply
        working-directory: deploy/gcp/terraform
        env:
          TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
          TF_VAR_monitor_image: ${{ vars.MONITOR_IMAGE }}
          TF_VAR_doppler_token: ${{ secrets.MONITOR_DOPPLER_TOKEN }}
        run: |
          terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=rpc-latency-monitor"
          terraform plan -out=tf.plan
          terraform apply tf.plan
