# Deploy the rpc-latency-monitor fleet. Push to main (src/deploy/grafana paths)
# auto-deploys; manual runs via workflow_dispatch can scope the target.
#
# Required (GitHub Environment: prod):
#   secrets: DOPPLER_TOKEN, SLACK_DEPLOY_WEBHOOK_URL
#   vars:    GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_SERVICE_ACCOUNT,
#            GCP_PROJECT_ID, TF_STATE_BUCKET
# Doppler (rpc-latency-monitor/prd) supplies: MONITOR_DOPPLER_TOKEN,
#   GRAFANA_API_URL, GRAFANA_API_TOKEN, GRAFANA_FOLDER_UID.
name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'deploy/**'
      - 'grafana/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      target:
        description: "What to deploy"
        type: choice
        options: [all, gcp, grafana]
        default: all
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # Gate: a broken build/test must never reach the fleet. `push` runs this in
  # parallel with the CI workflow, so we re-check here rather than trust timing.
  verify:
    name: Verify (fmt, clippy, test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features

  deploy:
    name: Deploy fleet (${{ github.event_name == 'workflow_dispatch' && inputs.target || 'all' }})
    needs: verify
    runs-on: ubuntu-latest
    environment: prod
    env:
      TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'all' }}
      DOPPLER_PROJECT: rpc-latency-monitor
      DOPPLER_CONFIG: prd
      REGION: us-east4
    steps:
      - uses: actions/checkout@v4

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Build image + apply Terraform + roll the fleet
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          set -euo pipefail
          doppler run --project "$DOPPLER_PROJECT" --config "$DOPPLER_CONFIG" -- \
            env PROJECT="$PROJECT" REGION="$REGION" TF_STATE_BUCKET="$TF_STATE_BUCKET" TARGET="$TARGET" \
            ./deploy/gcp/deploy.sh

      - name: Notify Slack
        if: always()
        env:
          SLACK: ${{ secrets.SLACK_DEPLOY_WEBHOOK_URL }}
          STATUS: ${{ job.status }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${SLACK:-}" ]; then echo "::warning::SLACK_DEPLOY_WEBHOOK_URL missing — skipping"; exit 0; fi
          echo "::add-mask::$SLACK"
          SHA="$(git rev-parse HEAD)"
          MSG="$(git log -1 --format=%s "$SHA" 2>/dev/null | cut -c1-140 || echo "")"
          if [ "$STATUS" = "success" ]; then MARKER="[DONE] Deploy rpc-latency-monitor ($TARGET)"; COLOR="#36a64f"; else MARKER="[FAILED] Deploy rpc-latency-monitor ($TARGET)"; COLOR="#cc0000"; fi
          FIELDS=$(jq -n \
            --arg target "$TARGET" --arg short_sha "${SHA:0:7}" --arg msg "$MSG" \
            --arg actor "$ACTOR" --arg run "$RUN_URL" --arg rid "$RUN_ID" \
            '[
              {type:"mrkdwn",text:("*Target:*\n`"+$target+"`")},
              {type:"mrkdwn",text:("*Commit:*\n`"+$short_sha+"` — "+$msg)},
              {type:"mrkdwn",text:("*Triggered by:*\n"+$actor)},
              {type:"mrkdwn",text:("*Run:*\n<"+$run+"|workflow #"+$rid+">")}
            ]')
          PAYLOAD=$(jq -n --arg marker "$MARKER" --arg color "$COLOR" --argjson fields "$FIELDS" \
            '{
              text: ("*" + $marker + "*"),
              attachments: [{
                color: $color,
                blocks: [
                  {type:"section", text:{type:"mrkdwn", text:("*" + $marker + "*")}},
                  {type:"section", fields:$fields}
                ]
              }]
            }')
          curl -sS --fail-with-body -X POST -H 'Content-Type: application/json' --data "$PAYLOAD" "$SLACK"
