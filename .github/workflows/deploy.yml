name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "What to deploy"
        type: choice
        options: [all, gcp, grafana]
        default: all
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  verify:
    name: Verify (fmt, clippy, test)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features

  deploy:
    name: Deploy fleet (${{ github.event_name == 'workflow_dispatch' && inputs.target || 'all' }})
    needs: verify
    runs-on: self-hosted
    environment: prod
    env:
      TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'all' }}
      DOPPLER_PROJECT: rpc-latency-monitor
      DOPPLER_CONFIG: prd
      REGION: us-east4
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Build Slack fields
        id: summary
        env:
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          COMMIT_MSG=$(git log -1 --format=%s HEAD 2>/dev/null | cut -c1-140 || echo "")
          FIELDS=$(jq -n \
            --arg short_sha  "${SHA:0:7}" \
            --arg commit_msg "$COMMIT_MSG" \
            --arg actor      "$ACTOR" \
            --arg run_url    "$RUN_URL" \
            --arg run_id     "$RUN_ID" \
            '[
              {type:"mrkdwn",text:("*Commit:*\n`"+$short_sha+"` — "+$commit_msg)},
              {type:"mrkdwn",text:("*Triggered by:*\n"+$actor)},
              {type:"mrkdwn",text:("*Run:*\n<"+$run_url+"|workflow #"+$run_id+">")}
            ]')
          {
            echo 'fields<<JQ_EOF'
            echo "$FIELDS"
            echo 'JQ_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Notify Slack — deploy started
        env:
          SLACK: ${{ secrets.SLACK_DEPLOY_WEBHOOK_URL }}
          FIELDS: ${{ steps.summary.outputs.fields }}
        run: |
          set -euo pipefail
          if [ -z "${SLACK:-}" ]; then echo "::warning::SLACK_DEPLOY_WEBHOOK_URL missing — skipping"; exit 0; fi
          echo "::add-mask::$SLACK"
          PAYLOAD=$(jq -n \
            --arg marker "[STARTED] Deploy rpc-latency-monitor" \
            --arg color  "#36a64f" \
            --argjson fields "$FIELDS" \
            '{
              text: ("*" + $marker + "*"),
              attachments: [{color:$color, blocks:[
                {type:"section", text:{type:"mrkdwn", text:("*" + $marker + "*")}},
                {type:"section", fields:$fields}
              ]}]
            }')
          curl -sS --fail-with-body -X POST -H 'Content-Type: application/json' --data "$PAYLOAD" "$SLACK"

      - name: Build image + apply Terraform + roll the fleet
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          set -euo pipefail
          doppler run --project "$DOPPLER_PROJECT" --config "$DOPPLER_CONFIG" -- \
            env PROJECT="$PROJECT" REGION="$REGION" TF_STATE_BUCKET="$TF_STATE_BUCKET" TARGET="$TARGET" \
            ./deploy/gcp/deploy.sh

      - name: Notify Slack — deploy succeeded
        if: success()
        env:
          SLACK: ${{ secrets.SLACK_DEPLOY_WEBHOOK_URL }}
          FIELDS: ${{ steps.summary.outputs.fields }}
        run: |
          set -euo pipefail
          if [ -z "${SLACK:-}" ]; then exit 0; fi
          echo "::add-mask::$SLACK"
          PAYLOAD=$(jq -n \
            --arg marker "[SUCCESS] Deploy rpc-latency-monitor" \
            --arg color  "#36a64f" \
            --argjson fields "$FIELDS" \
            '{
              text: ("*" + $marker + "*"),
              attachments: [{color:$color, blocks:[
                {type:"section", text:{type:"mrkdwn", text:("*" + $marker + "*")}},
                {type:"section", fields:$fields}
              ]}]
            }')
          curl -sS --fail-with-body -X POST -H 'Content-Type: application/json' --data "$PAYLOAD" "$SLACK"

      - name: Notify Slack — deploy failed
        if: failure()
        env:
          SLACK: ${{ secrets.SLACK_DEPLOY_WEBHOOK_URL }}
          FIELDS: ${{ steps.summary.outputs.fields }}
        run: |
          set -euo pipefail
          if [ -z "${SLACK:-}" ]; then exit 0; fi
          echo "::add-mask::$SLACK"
          PAYLOAD=$(jq -n \
            --arg marker "[FAILED] Deploy rpc-latency-monitor" \
            --arg color  "#cc0000" \
            --argjson fields "$FIELDS" \
            '{
              text: ("*" + $marker + "*"),
              attachments: [{color:$color, blocks:[
                {type:"section", text:{type:"mrkdwn", text:("*" + $marker + "*")}},
                {type:"section", fields:$fields}
              ]}]
            }')
          curl -sS --fail-with-body -X POST -H 'Content-Type: application/json' --data "$PAYLOAD" "$SLACK"
