name: Build & Publish

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'deploy/Dockerfile'
      - 'deploy/cloudbuild.yaml'
      - 'grafana/**'
      - '.github/workflows/build-publish.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: build-publish
  cancel-in-progress: false

jobs:
  verify:
    name: Verify (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features

  publish:
    name: Build image + push dashboards
    needs: verify
    runs-on: ubuntu-latest
    environment: prod
    env:
      REGION: us-east4
    steps:
      - uses: actions/checkout@v4
      - uses: dopplerhq/cli-action@014df23b1329b615816a38eb5f473bb9000700b1 # v3

      - name: Fetch Slack webhook from Doppler
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set -euo pipefail
          if URL=$(doppler secrets get SLACK_DEPLOY_WEBHOOK_URL --plain \
                     --project rpc-latency-monitor --config prd 2>&1) && [ -n "$URL" ]; then
            echo "::add-mask::$URL"
            echo "SLACK_WEBHOOK=$URL" >> "$GITHUB_ENV"
          else
            echo "::warning::SLACK_DEPLOY_WEBHOOK_URL missing or unreadable from Doppler — deploy notifications will be skipped. doppler said: $URL"
          fi

      - name: Build deploy summary (commit, actor, image)
        id: summary
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          SHA="$(git rev-parse --short HEAD)"
          COMMIT_MSG=$(git log -1 --format=%s HEAD 2>/dev/null | cut -c1-140 || echo "")
          FIELDS=$(jq -n \
            --arg target     "all" \
            --arg scope      "all" \
            --arg image      "$SHA" \
            --arg short_sha  "$SHA" \
            --arg commit_msg "$COMMIT_MSG" \
            --arg actor      "${{ github.actor }}" \
            --arg run_url    "$RUN_URL" \
            --arg run_id     "${{ github.run_id }}" \
            '[
              {type:"mrkdwn",text:("*Target:*\n`"+$target+"`")},
              {type:"mrkdwn",text:("*Provider:*\n`"+$scope+"`")},
              {type:"mrkdwn",text:("*Image:*\n`"+$image+"`")},
              {type:"mrkdwn",text:("*Commit:*\n`"+$short_sha+"` — "+$commit_msg)},
              {type:"mrkdwn",text:("*Triggered by:*\n"+$actor)},
              {type:"mrkdwn",text:("*Run:*\n<"+$run_url+"|workflow #"+$run_id+">")}
            ]')
          {
            echo 'fields<<JQ_FIELDS_EOF'
            echo "$FIELDS"
            echo 'JQ_FIELDS_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Notify Slack — deploy started
        if: env.SLACK_WEBHOOK != ''
        run: |
          PAYLOAD=$(jq -n \
            --arg marker "[STARTED] Deploy RPC Latency Monitor" \
            --arg target "all" \
            --arg scope "all" \
            --arg color "#36a64f" \
            --argjson fields '${{ steps.summary.outputs.fields }}' \
            '{
              text: ("*" + $marker + "* — target: `" + $target + "` provider: `" + $scope + "`"),
              attachments: [{
                color: $color,
                blocks: [
                  {type:"section", text:{type:"mrkdwn", text:("*" + $marker + "*")}},
                  {type:"section", fields:$fields}
                ]
              }]
            }')
          curl -sS --fail-with-body -X POST -H 'Content-Type: application/json' \
            --data "$PAYLOAD" "$SLACK_WEBHOOK"

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2

      - name: Build + publish image to Artifact Registry
        env:
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          SHA="$(git rev-parse --short HEAD)"
          BASE="${REGION}-docker.pkg.dev/${PROJECT}/rpc-latency-monitor/rpc-latency-monitor"
          gcloud builds submit . --project "$PROJECT" \
            --config deploy/cloudbuild.yaml \
            --substitutions=_IMAGE="${BASE}:${SHA}" --suppress-logs
          echo "published ${BASE}:${SHA}"

      - name: Push dashboards to Grafana Cloud
        env:
          GRAFANA_API_URL: ${{ vars.GRAFANA_API_URL }}
          GRAFANA_API_TOKEN: ${{ secrets.GRAFANA_API_TOKEN }}
          GRAFANA_FOLDER_UID: ${{ vars.GRAFANA_FOLDER_UID }}
        run: |
          set -euo pipefail
          echo "::add-mask::$GRAFANA_API_TOKEN"
          for f in grafana/*.json; do
            payload="$(jq -n --slurpfile d "$f" --arg folder "${GRAFANA_FOLDER_UID:-}" \
              '{dashboard: ($d[0] + {id: null}), folderUid: $folder, overwrite: true}')"
            curl -sS --fail-with-body -X POST "$GRAFANA_API_URL/api/dashboards/db" \
              -H "Authorization: Bearer $GRAFANA_API_TOKEN" -H "Content-Type: application/json" \
              -d "$payload" >/dev/null
            echo "pushed dashboard $(basename "$f")"
          done

      - name: Notify Slack — build failed
        if: failure() && env.SLACK_WEBHOOK != ''
        run: |
          PAYLOAD=$(jq -n \
            --arg marker "[FAILED] Deploy RPC Latency Monitor" \
            --arg target "all" \
            --arg scope "all" \
            --arg color "#ff0000" \
            --argjson fields '${{ steps.summary.outputs.fields }}' \
            '{
              text: ("*" + $marker + "* — target: `" + $target + "` provider: `" + $scope + "`"),
              attachments: [{
                color: $color,
                blocks: [
                  {type:"section", text:{type:"mrkdwn", text:("*" + $marker + "*")}},
                  {type:"section", fields:$fields}
                ]
              }]
            }')
          curl -sS --fail-with-body -X POST -H 'Content-Type: application/json' \
            --data "$PAYLOAD" "$SLACK_WEBHOOK"

